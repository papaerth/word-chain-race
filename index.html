<meta charset="utf-8">
<title>끝말잇기 레이스</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&family=Fredoka:wght@500;700&display=swap">
<style>
/* Layout: one-screen phone game. Screen 1: fighting-game style select screen (1P/2P portraits + VS, 24-character roster). Screen 2: race map + turn panel with the mic as the hero control. Single bright playroom theme by choice. */
:root{
  --bg:#fff6e5;
  --paper:#ffffff;
  --ink:#2b2340;
  --muted:#7b7290;
  --line:#efdfc4;
  --accent:#ff6b4a;
  --accent-ink:#ffffff;
  --sky:#4fb6ff;
  --grass:#5ccf7a;
  --sun:#ffc93c;
  --berry:#c86bff;
  --good:#2aa660;
  --bad:#e0443c;
  --display:'Jua','Fredoka','Noto Sans KR',sans-serif;
  --body:'Noto Sans KR','Fredoka',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
button{font-family:var(--display);font-size:1.05rem;border:0;border-radius:14px;padding:12px 18px;cursor:pointer;color:var(--ink);background:var(--paper);box-shadow:0 3px 0 var(--line)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 #c94a2f}
button.primary:active{box-shadow:0 1px 0 #c94a2f}
button.ghost{background:transparent;box-shadow:none;color:var(--muted);text-decoration:underline;padding:6px 8px}
button[disabled]{opacity:.45;cursor:default;transform:none}
.app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:1.45rem;color:var(--accent);white-space:nowrap}
.lang{display:flex;gap:4px;background:var(--paper);border-radius:999px;padding:3px;box-shadow:0 2px 0 var(--line)}
.lang button{padding:5px 9px;border-radius:999px;box-shadow:none;font-size:.85rem;white-space:nowrap}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.mute{padding:4px 8px;border-radius:999px;font-size:1rem;box-shadow:0 2px 0 var(--line);flex:none}
header .lang{margin-left:auto}
.card{background:var(--paper);border-radius:20px;padding:16px;box-shadow:0 4px 0 var(--line)}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}

/* picker: fighting-game select screen. Two portraits + VS on top, the whole roster spread below in four colored bands. */
:root{--p1:#ffc93c;--p2:#4fb6ff}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:6px}
.portrait{position:relative;padding:12px 6px 8px;border-radius:22px;border:4px solid var(--line);background:var(--bg);box-shadow:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;transition:transform .2s}
.portrait .tag{position:absolute;top:-12px;left:10px;font-family:var(--display);font-size:.9rem;padding:2px 10px;border-radius:999px;color:var(--ink)}
.portrait.p1 .tag{background:var(--p1)}.portrait.p2 .tag{background:var(--p2);color:#fff}
.portrait.active{transform:scale(1.04);background:#fff}
.portrait.p1.active{border-color:var(--p1);box-shadow:0 0 0 4px rgba(255,201,60,.35)}
.portrait.p2.active{border-color:var(--p2);box-shadow:0 0 0 4px rgba(79,182,255,.35)}
.portrait .face svg{width:96px;height:96px;display:block}
.portrait .face.empty svg{opacity:.18;filter:grayscale(1)}
.portrait .cname{font-family:var(--display);font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.vsmark{font-family:var(--display);font-size:2rem;color:var(--accent);transform:rotate(-8deg);text-shadow:2px 2px 0 #fff,3px 3px 0 var(--line)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.names>div{display:flex;flex-direction:column;gap:6px;min-width:0}
.names input{font:inherit;font-size:1rem;padding:8px 10px;border:2px solid var(--line);border-radius:12px;width:100%;min-width:0;text-align:center}
.toggle{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);justify-content:center}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.pickttl{font-size:1.3rem;text-align:center;margin:14px 0 8px;color:var(--ink)}
.pickttl .who{display:inline-block;padding:0 10px;border-radius:999px}
.pickttl .who.p1{background:var(--p1)}.pickttl .who.p2{background:var(--p2);color:#fff}
.roster{display:flex;flex-direction:column;gap:12px}
.band{border-radius:18px;padding:12px 6px 6px;background:var(--band);position:relative}
.band .blabel{position:absolute;top:-10px;left:12px;font-family:var(--display);font-size:.85rem;padding:1px 10px;border-radius:999px;background:#fff;color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.08)}
.band .cells{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.cellbtn{padding:4px 0 2px;border-radius:14px;box-shadow:none;border:3px solid transparent;background:rgba(255,255,255,.55);display:flex;flex-direction:column;align-items:center;gap:0;font-size:.62rem;font-family:var(--body);color:var(--ink);min-width:0;line-height:1.1}
.cellbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cellbtn svg{width:100%;max-width:52px;height:auto}
.cellbtn.sel1{border-color:var(--p1);background:#fff;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.cellbtn.sel2{border-color:var(--p2);background:#fff;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.85)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.cellbtn.sel1,.cellbtn.sel2{animation:none}}
.pickfoot .hint{flex:1;min-width:0}
.rules{font-size:.9rem;color:var(--muted);margin:0;padding-left:1.1em}
.rules li{margin:2px 0}
.rules b{color:var(--ink)}
.pickfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}

/* board */
#board{width:100%;height:auto;display:block;border-radius:18px}
.cellnum{font-family:var(--display);font-size:10px;fill:#2b2340;opacity:.7}
#board .tag{font-family:var(--display);font-size:10px;fill:#2b2340}
#board .corner{font-family:var(--display);font-size:13px;fill:#2b2340}
#board .plaque{font-family:var(--display);font-size:24px;fill:#2b2340}
#board .cname{font-family:var(--display);font-size:11px;fill:#2b2340}
#board .cpos{font-family:var(--display);font-size:14px;fill:#ff6b4a}
.token{transition:transform .17s cubic-bezier(.3,1.4,.5,1)}
.own{transition:opacity .3s}
@media (prefers-reduced-motion:reduce){.token{transition:none}}
.standings{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:.9rem}
.standings div{display:flex;align-items:center;gap:6px;min-width:0}
.standings svg{width:30px;height:30px;flex:none}
.standings b{font-family:var(--display);font-weight:400;font-size:1.1rem;font-variant-numeric:tabular-nums}
.standings .active{color:var(--accent)}

/* turn panel */
.turn{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.who{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--display);font-size:1.25rem}
.who svg{width:40px;height:40px}
.who{flex-wrap:wrap}
.trapchip{width:100%;font-size:1rem;color:#fff;background:var(--bad);border-radius:999px;padding:4px 12px;animation:pulse 1s ease-in-out infinite}
.need{display:flex;align-items:baseline;justify-content:center;gap:10px;flex-wrap:wrap}
.need .syl{font-family:var(--display);font-size:4.2rem;line-height:1;color:var(--sky)}
.need .syl.any{font-size:2rem}
.need .lbl{font-size:.95rem;color:var(--muted)}
.lastword{font-size:.95rem;color:var(--muted)}
.lastword b{color:var(--ink);font-family:var(--display);font-weight:400;font-size:1.15rem}
.mic{width:150px;height:150px;border-radius:50%;background:var(--accent);box-shadow:0 8px 0 #c94a2f;display:grid;place-items:center;padding:0;position:relative}
.mic.fast::after{content:'⚡';position:absolute;top:-6px;right:-6px;width:40px;height:40px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-size:1.3rem;box-shadow:0 3px 0 #d9a400}
.mic svg{width:66px;height:66px;fill:#fff}
.mic.auto{background:var(--sky);box-shadow:0 8px 0 #2e86c7}
.mic.auto::before{content:'ON';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-family:var(--display);font-size:.8rem;padding:1px 10px;border-radius:999px}
.mic.listening{background:var(--sky);box-shadow:0 8px 0 #2e86c7;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.mic.listening{animation:none}}
.hint{font-size:.9rem;color:var(--muted);min-height:1.4em}
.heard{width:100%;display:none;flex-direction:column;gap:8px;align-items:center}
.heard.show{display:flex}
.heard .word{font-family:var(--display);font-size:2.4rem;line-height:1.1;padding:6px 18px;border-radius:16px;background:var(--bg)}
.heard .word.ok{background:#e3f7e8;color:var(--good)}
.heard .word.no{background:#fde3e1;color:var(--bad)}
.heard .why{font-size:.9rem;color:var(--bad)}
.meaning{font-size:.95rem;color:var(--ink);background:#fff8dc;border-radius:12px;padding:6px 14px;max-width:100%}
.meaning:empty{display:none}
.lastword .m{display:block;font-size:.9rem;color:var(--muted);margin-top:2px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.typing{display:flex;gap:6px;width:100%}
.typing input{flex:1;min-width:0;font:inherit;font-size:1.15rem;padding:10px 12px;border:2px solid var(--line);border-radius:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-family:var(--display);font-size:1.1rem;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center;z-index:20}
.toast.show{opacity:1}
.log{font-size:.85rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 6px;align-self:flex-start}
.tools{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.tools button{font-size:1.25rem;padding:8px 12px;border-radius:14px;background:var(--bg);box-shadow:0 3px 0 var(--line);line-height:1}
#hintbtn{background:var(--sun);box-shadow:0 3px 0 #d9a400;font-size:1rem}
.tools button[aria-pressed="true"]{background:var(--ink);color:#fff}
.boardwrap{position:relative;margin-top:4px}
.burst{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:86%;max-width:340px;text-align:center;pointer-events:none;z-index:5;display:flex;flex-direction:column;align-items:center;gap:4px}
.burst .bword{font-family:var(--display);font-size:2.6rem;line-height:1.1;color:#fff;background:var(--ink);padding:6px 22px;border-radius:999px;box-shadow:0 6px 0 rgba(0,0,0,.25);animation:bpop .5s cubic-bezier(.3,1.6,.5,1) both}
.burst .bline{font-family:var(--display);font-size:1.15rem;white-space:nowrap;color:var(--ink);background:#fff;padding:4px 14px;border-radius:999px;box-shadow:0 3px 0 var(--line);animation:bpop .5s .25s cubic-bezier(.3,1.6,.5,1) both;max-width:100%}
.burst .btotal{font-family:var(--display);font-size:3.2rem;line-height:1;color:var(--accent);text-shadow:3px 3px 0 #fff,5px 5px 0 var(--sun);animation:bpop .6s .5s cubic-bezier(.3,1.8,.5,1) both}
.burst .bline:empty,.burst .btotal:empty,.burst .bword:empty{display:none}
.burst.small .bword{font-size:1.5rem}.burst.small .btotal{font-size:2.2rem}
@keyframes bpop{0%{transform:scale(0) rotate(-8deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.confetti{position:absolute;inset:-60px;pointer-events:none}
.confetti i{position:absolute;left:50%;top:50%;width:10px;height:14px;border-radius:3px;animation:fly 1.1s ease-out forwards}
@keyframes fly{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.burst .bword,.burst .bline,.burst .btotal{animation:none}.confetti{display:none}}
.hintbox{background:#fff8dc;border:2px dashed var(--sun);border-radius:14px;padding:10px 16px;font-size:1rem}
.hintbox b{font-family:var(--display);font-weight:400;font-size:1.6rem;color:var(--ink);margin-left:6px}
.log span{padding:1px 8px;border-radius:999px;background:var(--bg)}
/* chance card overlay */
.overlay{position:fixed;inset:0;background:rgba(43,35,64,.55);display:grid;place-items:center;z-index:30;padding:16px}
.cardface{background:#fff;border-radius:24px;padding:24px 20px;max-width:320px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;border:6px solid var(--berry)}
.cardface .eyebrow{color:var(--berry)}
.cardface h2{font-size:1.7rem}
.cardface p{margin:0;color:var(--muted)}
.winner{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.winner svg{width:120px;height:120px}
.winner h2{font-size:2rem;color:var(--accent)}
.stat{display:flex;gap:18px;justify-content:center;font-size:.95rem;color:var(--muted);flex-wrap:wrap}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:1.5rem;color:var(--ink)}
</style>

<div class="app">
  <header>
    <h1 id="title">끝말잇기 레이스</h1>
    <div class="lang" role="group" aria-label="language">
      <button id="lang-ko" aria-pressed="true">한국어</button>
      <button id="lang-en" aria-pressed="false">English</button>
    </div>
    <button class="mute" id="mute" aria-label="sound">🔊</button>
  </header>

  <!-- SCREEN 1: character picker -->
  <section class="card" id="setup">
    <div class="vs">
      <button class="portrait p1" id="port0" aria-label="player 1"><span class="tag">1P</span><div class="face" id="face0"></div><div class="cname" id="cname0"></div></button>
      <div class="vsmark">VS</div>
      <button class="portrait p2" id="port1" aria-label="player 2"><span class="tag">2P</span><div class="face" id="face1"></div><div class="cname" id="cname1"></div></button>
    </div>
    <div class="names">
      <div><input id="name0" aria-label="player 1 name"><label class="toggle"><input type="checkbox" id="kid0"><span data-t="kid">아이 모드</span></label></div>
      <div><input id="name1" aria-label="player 2 name"><label class="toggle"><input type="checkbox" id="kid1" checked><span data-t="kid">아이 모드</span></label></div>
    </div>
    <h2 class="pickttl" id="pickttl"></h2>
    <div class="roster" id="roster"></div>
    <div class="pickfoot">
      <span class="hint" id="pickhint"></span>
      <button class="primary" id="next" style="font-size:1.3rem;padding:12px 34px" data-t="next2">출발!</button>
    </div>
  </section>

  <section class="card" id="rulescard">
    <div class="eyebrow" data-t="howto">놀이 방법</div>
    <ul class="rules" style="margin-top:8px" id="rules"></ul>
  </section>

  <!-- SCREEN 2: race -->
  <section class="card" id="boardcard" hidden>
    <div class="boardwrap">
      <svg id="board" viewBox="-8 -8 496 496" aria-label="board"></svg>
      <div class="burst" id="burst" hidden><div class="bword" id="bword"></div><div class="bline" id="bline"></div><div class="btotal" id="btotal"></div><div class="confetti" id="confetti"></div></div>
    </div>
    <div class="standings" id="standings"></div>
    <div class="eyebrow" id="dictbadge" hidden style="margin-top:6px"></div>
  </section>

  <section class="card turn" id="turncard" hidden>
    <div class="who" id="who"></div>
    <div class="need"><span class="lbl" id="needlbl"></span><span class="syl" id="syl"></span></div>
    <div class="lastword" id="lastword"></div>
    <button class="mic" id="mic" aria-label="speak"><svg viewBox="0 0 24 24"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4zm6-4a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.93V22h2v-3.07A8 8 0 0 0 20 11h-2z"/></svg></button>
    <div class="hint" id="hint"></div>
    <div class="heard" id="heard">
      <div class="word" id="heardword"></div>
      <div class="meaning" id="meaning"></div>
      <div class="why" id="why"></div>
      <div class="row">
        <button class="primary" id="accept" data-t="accept">맞아요!</button>
        <button id="override" data-t="override" hidden>그래도 인정 ✔</button>
        <button id="retry" data-t="retry">다시 말하기</button>
      </div>
    </div>
    <div class="hintbox" id="hintbox" hidden></div>
    <div class="typing" id="typing" hidden><input id="typed" autocomplete="off" aria-label="type a word"><button id="typego" data-t="typego">입력</button></div>
    <div class="tools">
      <button id="hintbtn" title="hint"></button>
      <button id="keybtn" title="type">⌨️</button>
      <button id="sos" title="no word">🆘</button>
      <button id="pass" title="pass">⏭️</button>
      <button id="undo" title="undo">↩️</button>
      <button id="wordsbtn" title="words">📖</button>
      <button id="quit" title="home">🏠</button>
    </div>
    <div class="log" id="log" hidden></div>
  </section>

  <section class="card winner" id="wincard" hidden>
    <div id="winchar"></div>
    <h2 id="wintitle"></h2>
    <div class="stat" id="winstat"></div>
    <div class="row"><button class="primary" id="lap" data-t="lap">한 바퀴 더 (땅 유지)</button><button id="again" data-t="newgame">새로 하기</button></div>
  </section>
</div>
<div class="toast" id="toast"></div>
<div class="overlay" id="overlay" hidden><div class="cardface"><div class="eyebrow" data-t="chance">찬스 카드</div><h2 id="cardttl"></h2><p id="carddesc"></p><button class="primary" id="cardok" data-t="ok">확인</button></div></div>

<script>
// ---------- characters: 4 groups × 6, drawn from parts ----------
const FACE=`<circle cx="22" cy="28" r="4.5" fill="#fff"/><circle cx="38" cy="28" r="4.5" fill="#fff"/><circle cx="23" cy="29" r="2.2" fill="#2b2340"/><circle cx="39" cy="29" r="2.2" fill="#2b2340"/><path d="M23 39q7 6 14 0" stroke="#2b2340" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
const BODY=(c)=>`<path d="M30 7c14 0 24 10 24 24S44 56 30 56 6 44 6 31 16 7 30 7z" fill="${c}"/>`;
const P={ // parts: drawn before (bg) or after (fg) the body
 mask:(a)=>`<path d="M12 22h36v12H12z" fill="${a}" opacity=".85"/><circle cx="22" cy="28" r="4.5" fill="#fff"/><circle cx="38" cy="28" r="4.5" fill="#fff"/>`,
 cape:(a)=>`<path d="M8 30q-6 20 4 28h36q10-8 4-28z" fill="${a}"/>`,
 bolt:(a)=>`<path d="M31 10l-7 13h6l-4 11 10-15h-6l4-9z" fill="${a}"/>`,
 flame:(a)=>`<path d="M30 2c-3 6-9 8-9 15a9 9 0 0 0 18 0c0-5-3-7-4-11-1 3-3 4-5-4z" fill="${a}"/>`,
 crown:(a)=>`<path d="M16 14l6 6 8-10 8 10 6-6-2 12H18z" fill="${a}"/>`,
 helmet:(a)=>`<path d="M9 22a21 16 0 0 1 42 0v1H9z" fill="${a}"/><rect x="26" y="2" width="8" height="6" rx="2" fill="${a}"/>`,
 star:(a)=>`<path d="M30 40l3 6 6 1-4 4 1 6-6-3-6 3 1-6-4-4 6-1z" fill="${a}"/>`,
 wings:(a)=>`<path d="M8 34c-8-10-6-24 6-26-2 8 0 16 6 22z M52 34c8-10 6-24-6-26 2 8 0 16-6 22z" fill="${a}" opacity=".9"/>`,
 bug:(a)=>`<path d="M10 42c-8-16 0-32 20-32s28 16 20 32z" fill="${a}" opacity=".9"/>`,
 anten:(a)=>`<path d="M22 12q-4-8-10-8M38 12q4-8 10-8" stroke="${a}" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="12" cy="4" r="3" fill="${a}"/><circle cx="48" cy="4" r="3" fill="${a}"/>`,
 spots:(a)=>`<circle cx="18" cy="42" r="4" fill="${a}"/><circle cx="42" cy="42" r="4" fill="${a}"/><circle cx="30" cy="50" r="3.5" fill="${a}"/>`,

    g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol||.25,t0+.01);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);

    const s=c.createBufferSource();s.buffer=b;const g=c.createGain();const t0=c.currentTime+(when||0);g.gain.setValueAtTime(vol||.2,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);s.connect(g);g.connect(c.destination);s.start(t0);}
  const api={
    tap:()=>tone(880,.06,'square',.08),
    hop:()=>{tone(520,.09,'triangle',.22,0,780);},
    count:(n)=>{for(let i=0;i<n;i++)tone(600+i*120,.12,'square',.16,.55+i*.14);tone(1200,.3,'triangle',.2,.55+n*.14+.05);},
    good:()=>{tone(660,.1,'sine',.25);tone(990,.16,'sine',.25,.09);},
    bad:()=>{tone(220,.22,'sawtooth',.18,0,140);},
    bonus:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.14,'square',.14,i*.08));},
    trap:()=>{tone(600,.4,'sawtooth',.2,0,120);noise(.25,.15,.1);},
    chance:()=>{[1047,1319,1568,2093,1568,2093].forEach((f,i)=>tone(f,.1,'sine',.16,i*.06));},
    toll:()=>{tone(988,.12,'square',.14);tone(740,.25,'square',.14,.13);},
    claim:()=>{tone(392,.08,'triangle',.2);tone(523,.08,'triangle',.2,.08);noise(.08,.12,.16);},
    pass:()=>{tone(330,.15,'triangle',.18,0,250);},
    listen:()=>{tone(700,.07,'sine',.15);tone(900,.07,'sine',.15,.08);},
    swap:()=>{tone(400,.3,'sine',.2,0,1200);tone(1200,.3,'sine',.2,.3,400);},
    win:()=>{[523,523,523,659,784,659,784,1047].forEach((f,i)=>tone(f,i===7?.6:.14,'square',.16,i*.13));setTimeout(()=>{[1047,1319,1568].forEach((f,i)=>tone(f,.5,'triangle',.12,i*.02));},1100);},

    isMuted:()=>muted,
  };
  return api;
})();

function required(){if(!S.last)return null;const ch=S.last[S.last.length-1];return S.lang==='ko'?ch:ch.toUpperCase();}

function elapsed(){return (performance.now()-S.turnStart)/1000;}

// ---------- validation ----------
function normalize(w){w=(w||'').trim();if(S.lang==='ko')return w.replace(/[^가-힣]/g,'');return w.replace(/[^A-Za-z]/g,'').toLowerCase();}
function check(word){
  const w=normalize(word);const req=required();
  if(!w)return{ok:false,why:t('notHangul')};
  if(S.lang==='ko'){
    if(w.length<2)return{ok:false,why:t('tooShort')};
    if(req&&w[0]!==req&&w[0]!==DUEUM[req])return{ok:false,why:t('wrongStart',{s:DUEUM[req]?req+'/'+DUEUM[req]:req})};
  }else{
    if(w.length<3)return{ok:false,why:t('tooShort')};
    if(req&&w[0]!==req.toLowerCase())return{ok:false,why:t('wrongStart',{s:req})};
  }
  if(S.used.has(w))return{ok:false,why:t('used')};
  if(S.lang==='ko'&&deadEnd(w))return{ok:false,why:t('deadEnd',{s:w[w.length-1]})};
  if(S.lang==='ko'&&!MEAN.ko[w]&&!inDict(w))return{ok:false,soft:true,w,why:t('notInDict')};
  return{ok:true,w};
}
function showHeard(word,sec){
  const r=check(word);pending={word:r.ok||r.soft?r.w:normalize(word)||word,sec,ok:r.ok,soft:!!r.soft};
  $('heardword').textContent=pending.word;$('heardword').className='word '+(r.ok?'ok':'no');
  $('override').hidden=!r.soft;
  const p=S.players[S.turn];const stp=r.ok?lenSteps(r.w)+fastBonus(sec,p.kid):0;
  $('why').textContent=r.ok?(S.trap===S.turn?t('escaped').replace('!','?'):(S.lang==='ko'?`→ ${stp}칸 전진`:`→ move ${stp}`)):(r.soft?r.why+' — '+(S.lang==='ko'?'어른이 인정하면 2칸':'allow for 2 steps'):r.why);$('why').style.color=r.ok?'var(--good)':'var(--bad)';
  $('accept').disabled=!r.ok;$('heard').classList.toggle('show',!r.ok);if(!r.ok)SFX.bad();
  $('meaning').textContent='';
  if(r.ok)defineWord(pending.word).then(m=>{if(pending&&pending.word===r.w)$('meaning').textContent=m||'';});
}
// ---------- meanings: built-in list first, then ask Claude when the page runs inside claude.ai ----------
const meanCache={};let samplePromise=null;
function getSample(){if(!samplePromise)samplePromise=(window.claude&&claude.use)?claude.use('sample').catch(()=>null):Promise.resolve(null);return samplePromise;}
async function defineWord(w){
  const key=S.lang+':'+w;
  if(MEAN[S.lang][w])return MEAN[S.lang][w];
  if(meanCache[key]!==undefined)return meanCache[key];
  if(S.lang==='ko'){const d=await dictDef(w);if(d)return meanCache[key]=d;}
  const sample=await getSample();if(!sample)return meanCache[key]='';
  try{
    const q=S.lang==='ko'?`"${w}"라는 한국어 단어의 뜻을 7살 아이가 알아듣게 한 문장(20자 안팎)으로만 설명해. 단어가 실제로 없는 말이면 "사전에 없는 말 같아요"라고만 답해. 다른 말은 붙이지 마.`:`Explain the English word "${w}" to a 7-year-old in one short sentence (under 12 words). If it is not a real word, answer only "Not a real word, I think". Nothing else.`;
    const r=await sample(q,{modelTier:'quick'});meanCache[key]=(r.text||'').trim().replace(/^["']|["']$/g,'');
  }catch(e){meanCache[key]='';}
  return meanCache[key];
}
function pickBest(cands){for(const c of cands){const f=c.split(/\s+/)[0];if(check(f).ok)return f;}for(const c of cands){const f=c.split(/\s+/)[0];if(check(f).soft)return f;}return cands[0].split(/\s+/)[0];}

// ---------- committing a turn ----------
function snapshot(){return{pos:S.players.map(p=>p.pos),owner:Object.assign({},S.owner),level:Object.assign({},S.level),last:S.last,turn:S.turn,trap:S.trap,freepass:S.freepass.slice(),bonusPts:S.bonusPts.slice(),challenge:S.challenge,hints:S.players.map(p=>p.hints)};}
function restore(h){S.players.forEach((p,i)=>{p.pos=h.pos[i];if(h.hints)p.hints=h.hints[i];});S.owner=h.owner;S.level=h.level||{};S.last=h.last;S.turn=h.turn;S.trap=h.trap==null?null:h.trap;S.freepass=h.freepass||[false,false];S.bonusPts=h.bonusPts||[0,0];S.challenge=h.challenge||null;}
function commit(){
  if(!pending||!pending.ok)return;
  clearInterval(timerId);SFX.good();stopListening();
  const pi=S.turn,p=S.players[pi];const a=lenSteps(pending.word),fb=fastBonus(pending.sec,p.kid),n=a+fb;
  const snap=snapshot();
  S.history.push({pi,word:pending.word,snap});
  S.used.add(pending.word);S.last=pending.word;p.times.push(pending.sec);p.words++;
  $('heard').classList.remove('show');
  if(S.trap===pi){S.trap=null;SFX.bonus();burst(pending.word,'',t('escaped'),{ms:1600});setTimeout(()=>finish(pi,false),900);return;}
  let extra=0,chal='';
  if(S.challenge===pi){S.challenge=null;const okc=S.lang==='ko'?pending.word.length>=4:pending.word.length>=7;if(okc){extra=3;chal=' · '+t('challengeOk');}else chal=' · '+t('challengeNo');}
  const total=n+extra;
  const line=t('gradeName')[a-1]+` = ${a}`+(S.lang==='ko'?'칸':'')+(fb?(S.lang==='ko'?' ⚡빨리 +1':' ⚡fast +1'):'')+chal;
  burst(pending.word,line,(S.lang==='ko'?`${total}칸 전진!`:`Move ${total}!`),{ms:1900});
  SFX.count(total);
  setTimeout(()=>moveToken(pi,Math.min(N-1,p.pos+total),()=>setTimeout(()=>land(pi,false),350)),1300);
}
function land(pi,fromCard){
  const p=S.players[pi];const pos=p.pos;let extraTurn=false;
  if(pos>=N-1){setTimeout(()=>win(pi),300);return;}
  const o=S.owner[pos];
  if(BONUS[pos]){SFX.bonus();burst('⭐',t('bonus'),'',{small:true});setTimeout(()=>moveToken(pi,Math.min(N-1,pos+2),()=>after(pi,false)),500);}
  else if(TRAP[pos]){SFX.trap();burst('🍌',t('trap'),'',{small:true,confetti:false,ms:2200});S.trap=pi;renderStandings();setTimeout(startTurn,900);}
  else if(CHANCE[pos]&&!fromCard){
    SFX.chance();
    const W=T[S.lang].cardW;let r=Math.random()*W.reduce((a,b)=>a+b,0),k=0;while(r>=W[k]){r-=W[k];k++;}
    const q=S.players[1-pi];
    showCard(k,()=>{
      if(k===0){extraTurn=true;after(pi,true);}
      else if(k===1){SFX.bonus();moveToken(pi,Math.min(N-1,p.pos+3),()=>setTimeout(()=>land(pi,true),300));}
      else if(k===2){SFX.swap();const tmp=p.pos;p.pos=q.pos;q.pos=tmp;placeTokens();after(pi,false);}
      else if(k===3){SFX.trap();moveToken(pi,Math.max(0,p.pos-2),()=>setTimeout(()=>land(pi,true),300));}
      else if(k===4){SFX.claim();[p.pos-1,p.pos+1].forEach(c=>{if(c>0&&c<N-1&&!special(c)&&S.owner[c]==null){S.owner[c]=pi;S.level[c]=1;}});drawOwners();after(pi,false);}
      else if(k===5){const mine=Object.keys(S.owner).filter(c=>S.owner[c]===pi&&(S.level[c]||1)<3).sort((a,b)=>(S.level[a]||1)-(S.level[b]||1));
        if(mine.length){S.level[mine[0]]=(S.level[mine[0]]||1)+1;}else if(!special(p.pos)&&S.owner[p.pos]==null){S.owner[p.pos]=pi;S.level[p.pos]=1;}
        SFX.bonus();drawOwners();after(pi,false);}
      else if(k===6){const theirs=Object.keys(S.owner).filter(c=>S.owner[c]===1-pi).sort((a,b)=>(S.level[b]||1)-(S.level[a]||1));
        if(theirs.length){const c=theirs[0];if((S.level[c]||1)>1)S.level[c]--;else{delete S.owner[c];delete S.level[c];}}
        SFX.trap();drawOwners();after(pi,false);}
      else if(k===7){S.freepass[pi]=true;SFX.claim();after(pi,false);}
      else if(k===8){let tgt=null;for(let c=p.pos+1;c<N-1;c++)if(BONUS[c]){tgt=c;break;}SFX.swap();if(tgt==null)after(pi,false);else moveToken(pi,tgt,()=>setTimeout(()=>land(pi,true),300));}
      else if(k===9){p.hints++;SFX.good();after(pi,false);}
      else if(k===10){S.challenge=pi;SFX.listen();renderStandings();setTimeout(startTurn,600);}
      else {S.bonusPts[pi]+=2;SFX.bonus();after(pi,false);}
    });
  }
  else if(o!=null&&o!==pi&&S.freepass[pi]){S.freepass[pi]=false;SFX.good();burst('🎫',t('freepass'),'',{small:true,ms:1500});after(pi,false);}
  else if(o!=null&&o!==pi){const lv=S.level[pos]||1;SFX.toll();burst(['🏠','🏢','🏨'][lv-1],t('toll',{n:S.players[o].name,b:t('bld')[lv-1],k:lv}),'',{small:true,confetti:false,ms:1900});setTimeout(()=>moveToken(pi,Math.max(0,pos-lv),()=>after(pi,false)),800);}
  else if(o===pi){const lv=S.level[pos]||1;if(lv<3){S.level[pos]=lv+1;SFX.bonus();burst(['🏠','🏢','🏨'][lv],t('upgrade',{b:t('bld')[lv]}),'',{small:true,ms:1600});drawOwners();}after(pi,false);}
  else{if(o==null&&pos>0){S.owner[pos]=pi;S.level[pos]=1;SFX.claim();burst('🏠',t('claim',{n:pos+1}),'',{small:true,ms:1300});drawOwners();}after(pi,false);}
}
function after(pi,extraTurn){
  const p=S.players[pi];
  if(p.pos>=N-1){setTimeout(()=>win(pi),300);return;}
  finish(pi,extraTurn);
}
function finish(pi,extraTurn){
  renderStandings();
  if(!extraTurn)S.turn=1-pi;
  setTimeout(startTurn,700);
}
function showCard(k,cb){stopListening();const c=T[S.lang].cards[k];$('cardttl').textContent=c.t;$('carddesc').textContent=c.d;$('overlay').hidden=false;$('cardok').onclick=()=>{SFX.tap();$('overlay').hidden=true;cb();};}
$('accept').onclick=commit;
$('override').onclick=()=>{if(pending&&pending.soft){pending.ok=true;pending.soft=false;commit();}};
$('pass').onclick=()=>{
  clearInterval(timerId);stopListening();const p=S.players[S.turn];
  S.history.push({pi:S.turn,word:'—',snap:snapshot(),pass:true});
  if(S.trap===S.turn){S.trap=null;SFX.trap();burst('🍌',t('slipped'),'',{small:true,confetti:false});moveToken(S.turn,Math.max(0,p.pos-2),()=>finish(S.turn,false));return;}
  SFX.pass();burst('⏭️',t('passed'),'',{small:true,confetti:false,ms:1200});moveToken(S.turn,Math.max(0,p.pos-1),()=>finish(S.turn,false));
};
$('undo').onclick=()=>{
  const h=S.history.pop();if(!h)return;clearInterval(timerId);$('overlay').hidden=true;
  restore(h.snap);const p=S.players[h.pi];if(!h.pass){S.used.delete(h.word);p.times.pop();p.words--;}
  placeTokens();drawOwners();toast(t('undone'));setTimeout(startTurn,500);
};
$('typego').onclick=()=>{const v=$('typed').value;if(!v.trim())return;const sec=elapsed();showHeard(v,sec);if(pending&&pending.ok){$('typed').value='';commit();}};
$('typed').addEventListener('keydown',e=>{if(e.key==='Enter')$('typego').onclick();});


function win(i){
  S.phase='end';clearInterval(timerId);stopListening();SFX.win();const p=S.players[i];
  $('turncard').hidden=true;$('wincard').hidden=false;
  $('winchar').innerHTML=charSVG(CHARS[p.ch],120);$('wintitle').textContent=t('win',{n:p.name});
  const avg=p.times.length?(p.times.reduce((a,b)=>a+b,0)/p.times.length).toFixed(1):'0';
  const lands=Object.values(S.owner).filter(o=>o===i).length;
  S.wins[i]++;
  const sc=[scoreOf(0),scoreOf(1)];const fin=Math.max(...sc)>=20;const leader=sc[0]===sc[1]?i:(sc[0]>sc[1]?0:1);
  if(fin){$('wintitle').textContent=t('finalWin',{n:S.players[leader].name});$('winchar').innerHTML=charSVG(CHARS[S.players[leader].ch],120);}
  $('winstat').innerHTML=`<div>${t('words')}<b>${p.words}</b></div><div>${t('avg')}<b>${avg}s</b></div><div>${t('lands')}<b>${lands}</b></div>`+
    `<div style="width:100%;margin-top:6px">${t('goalPts')} · ${t('target')}<b style="font-size:1.8rem">${S.players.map((q,k)=>`${q.name} ${sc[k]}${t('score')}`).join(' : ')}</b></div>`;
  $('lap').hidden=fin;
  renderStandings();
}
let burstId;
function burst(word,line,total,opts){
  opts=opts||{};const el=$('burst');el.hidden=false;el.className='burst'+(opts.small?' small':'');
  $('bword').textContent=word||'';$('bline').textContent=line||'';$('btotal').textContent=total||'';
  // re-trigger animations
  ['bword','bline','btotal'].forEach(id=>{const e=$(id);e.style.animation='none';e.offsetHeight;e.style.animation='';});
  const cf=$('confetti');cf.innerHTML='';
  if(opts.confetti!==false){const cols=['#ff6b4a','#ffd34d','#5ccf7a','#4fb6ff','#c86bff'];for(let i=0;i<22;i++){const a=Math.random()*Math.PI*2,d=90+Math.random()*130;cf.innerHTML+=`<i style="background:${cols[i%5]};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;animation-delay:${Math.random()*.2}s"></i>`;}}
  clearTimeout(burstId);burstId=setTimeout(()=>{el.hidden=true;},opts.ms||1600);
  if(opts.scroll!==false)$('boardcard').scrollIntoView({behavior:'smooth',block:'center'});
}
let toastId;function toast(m){const el=$('toast');el.textContent=m;el.classList.add('show');clearTimeout(toastId);toastId=setTimeout(()=>el.classList.remove('show'),1800);}

// ---------- speech ----------
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let gotResult=false,micBlocked=false,autoMic=true,restartId=null;
// autoMic: after the first tap grants permission, every turn starts listening by itself and silence just restarts the listener
function showMissed(){SFX.bad();pending=null;$('heardword').textContent='…';$('heardword').className='word no';$('why').textContent=t('nothing');$('accept').disabled=true;$('heard').classList.add('show');$('hint').textContent='';}
function canListen(){return rec&&!micBlocked&&S.phase==='play'&&$('overlay').hidden;}
function startListening(){
  if(!rec||micBlocked){$('hint').textContent=micBlocked?t('micDenied'):t('noMic');$('typed').focus();return;}
  if(listening||!canListen())return;
  rec.lang=S.lang==='ko'?'ko-KR':'en-US';$('heard').classList.remove('show');pending=null;gotResult=false;
  try{rec.start();listening=true;$('mic').classList.add('listening');$('hint').textContent=t('listening');}
  catch(err){listening=false;$('mic').classList.remove('listening');}
}
function stopListening(){clearTimeout(restartId);if(listening){try{rec.abort();}catch(e){}}listening=false;$('mic').classList.remove('listening');}
function scheduleRestart(ms){clearTimeout(restartId);if(autoMic)restartId=setTimeout(()=>{if(!pending&&canListen())startListening();},ms||400);}
if(SR){rec=new SR();rec.interimResults=false;rec.maxAlternatives=4;
  rec.onresult=e=>{const sec=elapsed();const cands=[...e.results[0]].map(r=>r.transcript.trim()).filter(Boolean);if(!cands.length)return;gotResult=true;showHeard(pickBest(cands),sec);
    if(pending&&pending.ok)commit();else scheduleRestart(1200);};
  rec.onerror=e=>{listening=false;$('mic').classList.remove('listening');
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){micBlocked=true;autoMic=false;$('mic').classList.remove('auto');$('hint').textContent=t('micDenied');$('typed').focus();}
    else if(e.error==='no-speech'||e.error==='aborted'){gotResult=true;if(e.error==='no-speech')scheduleRestart(300);}
    else {gotResult=true;$('hint').textContent=t('micErr',{e:e.error});scheduleRestart(1500);}};
  rec.onend=()=>{listening=false;$('mic').classList.remove('listening');
    if(!gotResult&&!pending&&!micBlocked){if(autoMic)scheduleRestart(300);else showMissed();}};
}
// tap once: turns always-listening on (and asks for permission); tap again: off
$('mic').onclick=()=>{
  if(!rec||micBlocked){startListening();return;}
  autoMic=!autoMic;$('mic').classList.toggle('auto',autoMic);SFX.listen();
  if(autoMic)startListening();else{stopListening();$('hint').textContent=t('tapMic');}
};
$('retry').onclick=()=>{$('heard').classList.remove('show');pending=null;if(rec&&!micBlocked)startListening();};
$('mute').textContent=SFX.isMuted()?'🔇':'🔊';$('mute').onclick=()=>{$('mute').textContent=SFX.toggle()?'🔇':'🔊';};
applyLang();
</script>
